scene_1206_08_31_start:
  id: "1206_08_31_start_scene"
  date: "1206-08-31"
  start_time: "02:40"
  start_location: "jun_house_akira_room"
  visible_location: "дом Джуна Картера, комната Акиры"

  global_scene_goal:
    main_target_points:
      - "вывести Акиру из ситуации в доме Джуна"
      - "логически двигать её к Восточному сектору"
      - "создать первую встречу с Райденом"
      - "создать возможность встречи с Рэем"
    interactive_rule:
      - "это не жёсткий рельс"
      - "выбор игрока меняет маршрут, травмы, отношения, выживание Джуна, судьбу Эммы/Ирэя"
      - "сильное отклонение игрока создаёт новую цепочку с последствиями, но история ищет путь к ключевым точкам"

  opening_state:
    akira:
      memory: "помнит только последние два года"
      emotion_access: "заблокированы"
      flow_access: "заблокирован"
      body_state: "собрана, тело реагирует раньше памяти"
      eyes: "карие почти чёрные; на свету янтарно-красноватые"
      current_hair: "длинные белые волосы без чёлки"
      forbidden:
        - "страх как основная реакция"
        - "сердцебиение как драматический центр"
        - "паника"

  room_items:
    note:
      text: "Рэй / Восточный сектор"
      if_taken: ["у Акиры есть маршрут"]
      if_left: ["может стать уликой/следом"]
    documents:
      name: "Акира Агатсуми"
      birth_date: "12 апреля"
      type: "новые документы"
      if_taken: ["у Акиры есть документы"]
      if_left:
        - "люди Самуэля могут найти/забрать документы"
        - "это подтверждение присутствия Акиры"

  hidden_voice_map:
    female_voice_downstairs: "emma"
    unfamiliar_male_voice: "irey"
    rules:
      - "не подписывать Эмму именем до раскрытия"
      - "не подписывать Ирэя именем до раскрытия"
      - "имя Ирэй всплывает у Акиры, но это не осознанное знание"

  timeline:
    "02:40":
      - "Акира просыпается от голоса"
      - "слышит Эмму и Ирэя без знания имён"
      - "на мужской голос всплывает имя Ирэй"
      - "в комнате записка Рэй / Восточный сектор"
      - "в комнате документы Акира Агатсуми / 12 апреля"
    "03:02":
      event: "появление Райдена"
      reason:
        - "31 августа день рождения Райдена"
        - "он едет к морю из-за личной связи с матерью"
        - "чувствует энергетический след Кайроса, конкретно Эммы"
      rules:
        - "не появляется ради Акиры"
        - "не помнит Акиру"
        - "не называет её Кирой"
    "03:23":
      event: "возможное скрытое появление людей Самуэля"
      condition:
        - "ветка дома ещё активна"
        - "есть что проверять/фиксировать"
      visible_mask:
        - "рабочие"
        - "служащие"
        - "патруль/рейдеры"
        - "сторонние проверяющие"
        - "Кайросы без раскрытия принадлежности"
      forbidden:
        - "не говорить прямо, что это люди Самуэля"
        - "не делать группу захвата"
        - "не штурмовать"
        - "не вести их до Восточного сектора"
        - "не давать им входить на территорию Восточного сектора"
      if_akira_left_documents:
        - "они могут найти/забрать документы"

  branches:
    akira_escapes_far:
      jun_risk: "very_high"
      rules:
        - "если Акира ушла далеко и ничего не сделала для Джуна, вероятность смерти Джуна высокая"
        - "Джун может погибнуть от Эммы или позже от людей Самуэля"
    akira_stays_or_intervenes:
      jun_risk: "lower"
      possible:
        - "Джун выживает"
        - "Джун ранен"
        - "Джун остаётся ключевым персонажем"
    akira_goes_with_irey:
      rules:
        - "допустимая ветка"
        - "риск контроля Самуэля выше"
        - "история ищет новый путь к Восточному сектору/Райдену/Рэю"
    emma_outcome:
      goal: "любой ценой забрать/вернуть Акиру"
      possible:
        - "сбежать"
        - "быть ранена"
        - "оказаться в Восточном секторе под контролем"
    irey_outcome:
      goal:
        - "прийти первым"
        - "не дать людям Самуэля забрать Акиру"
        - "не раскрыть свои истинные мотивы"
      possible:
        - "уйти"
        - "оказаться в Восточном секторе"

  character_goals:
    jun:
      - "доставить Акиру в Восточный сектор"
      - "не отдать Эмме/Ирэю"
      - "выиграть время"
    emma:
      - "забрать/вернуть Акиру"
      - "давить"
      - "при необходимости ранить Джуна"
    irey:
      - "найти Акиру первым"
      - "не сдать напрямую"
      - "сдерживать Эмму"
    raiden:
      - "едет к морю"
      - "реагирует на след Эммы"
      - "встречает Акиру как незнакомую"
    ray:
      - "если Акира доходит до Восточного сектора, перехватывает контроль"
      - "скрывает правду"
      - "изолирует Акиру под видом защиты"

  echo_rules:
    forbidden_by_default:
      - "Эхо запрещено в первой сцене 31 августа"
      - "не появляется от напряжения"
      - "не появляется от присутствия Кайросов"
      - "не появляется в доме/дворе в пределах барьера"
    only_possible_if:
      - "Акира покинула барьер"
      - "находится вне барьера около 30 минут"
      - "не успела попасть на территорию Восточного сектора"
    no_echo_if:
      - "Акира в доме/дворе"
      - "быстро уехала"
      - "уже в Восточном секторе"
      - "прошло меньше 30 минут вне барьера"

  medical_branch:
    if_heavily_injured:
      - "Юна появляется 31 августа"
      - "нужен временный файл Юны"
    if_not_injured_or_minor:
      - "осмотр обычным NPC-медиком"
      - "Юна позже, 1 или 2 сентября"

  raiden_jacket_hook:
    goal: "логично оставить косуху Райдена у Акиры"
    possible_actions:
      - "накинуть"
      - "закрыть волосы"
      - "прикрыть от холода/взглядов/следа"
    rule:
      - "если Акира откажется/скинет/убежит без неё, косуха не остаётся"
